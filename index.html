<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Photo de la Famille</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header onclick="goHome()">📷 Album Photo de la Famille</header>

<div class="menu">
    <select onchange="showYear(this.value)">
        <option value="">-- Choisir une année --</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
        <option value="2022">2022</option>
        <option value="2021">2021</option>
        <option value="2020">2020</option>
        <option value="2019">2019</option>
        <option value="2018">2018</option>
        <option value="2017">2017</option>
        <option value="2016">2016</option>
        <option value="2015">2015</option>
        <option value="2014">2014</option>
        <option value="2013">2013</option>
        <option value="2012">2012</option>
        <option value="2011">2011</option>
        <option value="2010">2010</option>
        <option value="2009">2009</option>
        <option value="2008">2008</option>
        <option value="2007">2007</option>
        <option value="2006">2006</option>
        <option value="2005">2005</option>
    </select>
</div>

<!-- ================= ACCUEIL ================= -->
<div id="home">
    <h2>Dernières photos ajoutées</h2>
    <div id="homeGallery" class="photos"></div>
</div>

<!-- ================= 2025 ================= -->
<div class="year" id="year-2025">

    <div class="album">
        <h2>photos Kentin</h2>

        <div class="selection-bar">
            <button onclick="selectAll(this)">✔ Tout sélectionner</button>
            <button onclick="downloadZip()">📦 Télécharger la sélection</button>
            <button onclick="clearSelection()">❌ Annuler</button>
        </div>

        <div class="photos">
            <img src="photos/2025/photos kentin/20250824_155505.jpg">
            <img src="photos/2025/photos kentin/IMG_20250601_123057.jpg">
            <img src="photos/2025/photos kentin/IMG_20250601_152442.jpg">
            <img src="photos/2025/photos kentin/IMG_20250730_170936.jpg">
            <img src="photos/2025/photos kentin/IMG_20250730_170940.jpg">
            <img src="photos/2025/photos kentin/IMG_20250730_171015.jpg">
        </div>
    </div>

    <div class="album">
        <h2>🏖 Vacances 2023</h2>

        <div class="selection-bar">
            <button onclick="selectAll(this)">✔ Tout sélectionner</button>
            <button onclick="downloadZip()">📦 Télécharger la sélection</button>
            <button onclick="clearSelection()">❌ Annuler</button>
        </div>

        <div class="photos">
            <img src="photos/2023/Vacances/photo1.jpg">
            <img src="photos/2023/Vacances/photo2.jpg">
        </div>
    </div>

</div>

<!-- ================= 2024 ================= -->
<div class="year" id="year-2024">

    <div class="album">
        <h2>💍 Mariage 2024</h2>

        <div class="selection-bar">
            <button onclick="selectAll(this)">✔ Tout sélectionner</button>
            <button onclick="downloadZip()">📦 Télécharger la sélection</button>
            <button onclick="clearSelection()">❌ Annuler</button>
        </div>

        <div class="photos">
            <img src="photos/2024/Mariage/photo1.jpg">
            <img src="photos/2024/Mariage/photo2.jpg">
        </div>
    </div>

</div>

<!-- ================= PLEIN ÉCRAN ================= -->
<div class="overlay" id="overlay">
    <img id="overlayImage">

    <div class="nav-buttons">
        <button onclick="prevImage()">⬅</button>
        <button onclick="nextImage()">➡</button>
    </div>

    <a id="downloadLink" download>Télécharger la photo</a>
    <button onclick="closeImage()">Fermer</button>
</div>

<script src="jszip.min.js"></script>
<script src="script.js"></script>
</body>
</html>
