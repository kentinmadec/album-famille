<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Album de la famille</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <h1>📷 Album de la famille</h1>
</header>

<nav class="menu">
  <select id="yearSelect">
    <option value="">Choisir une année</option>
    <option value="2025">2025</option>
    <option value="2024">2024</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
    <option value="2021">2021</option>
    <option value="2020">2020</option>
    <option value="2019">2019</option>
    <option value="2018">2018</option>
    <option value="2017">2017</option>
    <option value="2016">2016</option>
    <option value="2015">2015</option>
    <option value="2014">2014</option>
    <option value="2013">2013</option>
    <option value="2012">2012</option>
    <option value="2011">2011</option>
    <option value="2010">2010</option>
    <option value="2009">2009</option>
    <option value="2008">2008</option>
    <option value="2007">2007</option>
    <option value="2006">2006</option>
    <option value="2005">2005</option>
  </select>

  <select id="albumSelect" disabled>
    <option value="">Choisir un album</option>
  </select>
</nav>

<p>Voici les 3 dernières photos ajoutées !</p>

<section class="carousel">
  <button class="carousel-btn prev" id="carouselPrev">❮</button>
  <img id="carouselImage" src="" alt="Dernières photos">
  <button class="carousel-btn next" id="carouselNext">❯</button>
</section>

<div class="actions">
  <button id="selectAll">Tout sélectionner</button>
  <button id="deselectAll">Tout désélectionner</button>
  <button id="downloadSelection">Télécharger la sélection (ZIP)</button>
</div>

<main>
  <div id="gallery" class="gallery"></div>
</main>

<!-- LIGHTBOX (PLEIN ÉCRAN) -->
<div id="lightbox" class="lightbox hidden">
  <button class="close">✕</button>
  <button id="lightboxPrev" class="lightbox-nav">❮</button>
  <img id="lightboxImage" src="" alt="Photo">
  <button id="lightboxNext" class="lightbox-nav">❯</button>
</div>

<script src="script.js"></script>
</body>
</html>
